[project]
name = "opensearch-dashboard-mcp"
version = "0.1.1"
description = "MCP server for OpenSearch Dashboards"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Evgenii Danilin", email = "evgenii.danilin.m@gmail.com" }]
keywords = ["mcp", "opensearch", "opensearch-dashboards", "llm"]
dependencies = [
    "mcp[cli]>=1.2.0,<2",
    "httpx>=0.27",
    "socksio>=1.0.0",
]

[project.scripts]
opensearch-dashboard-mcp = "opensearch_dashboard_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opensearch_dashboard_mcp"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Coverage is opt-in (CI passes --cov) so running a single test file locally
# doesn't trip the fail-under threshold.
addopts = "-ra"

[tool.coverage.run]
source = ["opensearch_dashboard_mcp"]
# Entrypoint shim: `from .server import main` + `if __name__` guard, no logic.
omit = ["*/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
